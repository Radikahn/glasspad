name: Glasspad
options:
  bundleIdPrefix: com.radikahn
  deploymentTarget:
    macOS: "15.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
targets:
  Glasspad:
    type: application
    platform: macOS
    sources:
      - path: Glasspad
        excludes:
          - Info.plist
    dependencies:
      - sdk: libsqlite3.tbd
    info:
      path: Glasspad/Info.plist
      properties:
        CFBundleName: Glasspad
        CFBundleDisplayName: Glasspad
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSApplicationCategoryType: public.app-category.productivity
        LSMinimumSystemVersion: $(MACOSX_DEPLOYMENT_TARGET)
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.radikahn.glasspad
        PRODUCT_NAME: Glasspad
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CODE_SIGN_IDENTITY: "-"
        CODE_SIGN_STYLE: Manual
        ENABLE_HARDENED_RUNTIME: NO
        COMBINE_HIDPI_IMAGES: YES
